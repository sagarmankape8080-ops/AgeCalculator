name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Fix Filenames and Extensions
      run: |
        # Agar srm.py hai toh use main.py banayein
        mv srm.py main.py || true
        # Agar logo sm.py naam se save ho gaya hai, toh use Sm.png me convert karein
        mv sm.py Sm.png || true

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev openjdk-17-jdk unzip zip
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy

    - name: Create Buildozer Spec File
      run: |
        buildozer init
        sed -i 's/^title =.*/title = Age Calculator/' buildozer.spec
        sed -i 's/^package.name =.*/package.name = agecalculator/' buildozer.spec
        sed -i 's/^package.domain =.*/package.domain = org.srm/' buildozer.spec
        sed -i 's/^source.include_exts =.*/source.include_exts = py,png,jpg/' buildozer.spec
        sed -i 's|^#icon.filename =.*|icon.filename = %(source.dir)s/Sm.png|' buildozer.spec
        sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec

    - name: Build Android APK
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AgeCalculator-APK
        path: bin/*.apk
        
